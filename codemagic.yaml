
workflows:
  ios-build:
    name: Otimizacao 
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Instalar XcodeGen
        script: |
          brew install xcodegen

      - name: Extrair e preparar projeto
        script: |
          ZIP_FILE=$(find "$CM_BUILD_DIR" -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Arquivo ZIP não encontrado"
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/source"
          unzip -o "$ZIP_FILE" -d "$CM_BUILD_DIR/source"

          PROJECT_YML=$(find "$CM_BUILD_DIR/source" -name project.yml | head -n 1)
          if [ -z "$PROJECT_YML" ]; then
            echo "project.yml não encontrado"
            exit 1
          fi

          cd "$(dirname "$PROJECT_YML")"
          xcodegen generate

      - name: Compilar aplicativo iOS
        script: |
          cd "$(dirname "$(find "$CM_BUILD_DIR/source" -name project.yml | head -n 1)")"

          xcodebuild \
            -project Otimizacao.xcodeproj \
            -scheme Otimizacao \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO

      - name: Empacotar IPA sem assinatura
        script: |
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"

          cp -R "$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/Otimizacao.app" \
            "$CM_BUILD_DIR/ipa/Payload/"

          cd "$CM_BUILD_DIR/ipa"
          zip -qr "$CM_BUILD_DIR/Otimizacao-unsigned.ipa" Payload

    artifacts:
      - Otimizacao-unsigned.ipa
      - build/Build/Products/Release-iphoneos/*.app
